! R1 - OSPF core router, inter-VLAN routing (router-on-a-stick),
!      DHCP and DNS server for the PCs.
! ".partial" = containerlab appends this to its own base config
! (hostname, management VRF on Ethernet0/0, SSH user admin/admin).
!
! Typos at the prompt are not treated as host names to telnet to,
! so the DNS lookup below never makes the CLI hang.
ip domain lookup
ip dns server
ip host r1.lab 1.1.1.1
ip host r2.lab 2.2.2.2
ip host r3.lab 3.3.3.3
ip host fw1.lab 10.0.34.2
ip host pc1.lab 192.168.10.10
ip host srv1.lab 203.0.113.10
!
ip dhcp excluded-address 192.168.10.1 192.168.10.99
ip dhcp excluded-address 192.168.20.1 192.168.20.99
ip dhcp pool VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.10.1
 domain-name lab
ip dhcp pool VLAN20
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.20.1
 domain-name lab
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface Ethernet0/1
 description Trunk to SW1 Ethernet0/1
 no ip address
 no shutdown
!
interface Ethernet0/1.10
 description VLAN 10 - SALES (PC1)
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface Ethernet0/1.20
 description VLAN 20 - ENGINEERING (PC2)
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
interface Ethernet0/2
 description to R2 Ethernet0/1
 ip address 10.0.12.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface Ethernet0/3
 description to R3 Ethernet0/1
 ip address 10.0.13.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface Ethernet0/1.10
 passive-interface Ethernet0/1.20
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.13.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
!
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
line vty 0 4
 exec-timeout 0 0
 logging synchronous
 transport preferred none
