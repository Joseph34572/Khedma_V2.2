# Connectivity tests for the phase1 lab (lab.sh test phase1).
# <node> <action> <target>        <what it proves>
PC1  ping   192.168.10.1          PC1 reaches its gateway: VLAN 10 + trunk + R1 subinterface
PC2  dhcp   eth1                  PC2 (Windows) got an address from R1's DHCP pool VLAN20
PC2  ping   192.168.10.10         inter-VLAN routing: VLAN 20 -> R1 -> VLAN 10
PC1  ping   2.2.2.2               OSPF: route to R2's loopback
PC1  ping   3.3.3.3               OSPF: route to R3's loopback
PC1  dns    srv1.lab              DNS: R1 answers from its host table
PC1  ping   203.0.113.10          default route via R3 and the firewall (NAT) to the Internet
PC1  http   203.0.113.10          web traffic is allowed by FW1 rule 20
PC2  http   203.0.113.10          ... also from VLAN 20
SRV1 noping 192.168.10.10         the Internet cannot reach inside (FW1 default deny)
