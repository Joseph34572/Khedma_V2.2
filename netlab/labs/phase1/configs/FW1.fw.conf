# FW1 - edge firewall between the lab (inside) and the "Internet" (outside).
# Same syntax as the fw CLI. After changes in the CLI, "write" saves them here
# (in the running copy of the lab under /var/lib/netlab/labs/phase1/).
hostname FW1
interface eth1 address 10.0.34.2/30
interface eth1 zone inside
interface eth2 address 203.0.113.1/24
interface eth2 zone outside
route default via 10.0.34.1
nat outside masquerade
rule 10 permit icmp from inside to outside
rule 20 permit tcp from inside to outside port 80,443
rule 30 permit udp from inside to outside port 53
default deny
