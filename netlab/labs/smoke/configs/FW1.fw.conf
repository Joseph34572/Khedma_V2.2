# FW1 for the smoke lab: two inside networks and one outside network.
hostname FW1
interface eth1 address 10.1.1.1/24
interface eth1 zone inside
interface eth2 address 10.2.2.1/24
interface eth2 zone inside
interface eth3 address 203.0.113.1/24
interface eth3 zone outside
nat outside masquerade
rule 5 permit any from inside to inside
rule 10 permit icmp from inside to outside
rule 20 permit tcp from inside to outside port 80,443
default deny
