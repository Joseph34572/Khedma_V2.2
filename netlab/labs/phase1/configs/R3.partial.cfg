! R3 - OSPF router at the edge: default route to the firewall,
!      advertised to R1 and R2 with "default-information originate".
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface Ethernet0/1
 description to R1 Ethernet0/3
 ip address 10.0.13.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface Ethernet0/2
 description to R2 Ethernet0/2
 ip address 10.0.23.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface Ethernet0/3
 description to FW1 eth1 (inside)
 ip address 10.0.34.1 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.0.34.2
!
router ospf 1
 router-id 3.3.3.3
 passive-interface Ethernet0/3
 network 3.3.3.3 0.0.0.0 area 0
 network 10.0.13.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.3 area 0
 network 10.0.34.0 0.0.0.3 area 0
 default-information originate
!
line con 0
 exec-timeout 0 0
 logging synchronous
 transport preferred none
line vty 0 4
 exec-timeout 0 0
 logging synchronous
 transport preferred none
